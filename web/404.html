<!DOCTYPE html>
<html>
  <head>
    <script>
      // Redirect any path to the root with a hash fragment so Flutter's
      // HashUrlStrategy can pick it up. Turns /experience into /#/experience.
      var path = window.location.pathname;
      var search = window.location.search;
      window.location.replace(
        window.location.origin + '/#' + path + search
      );
    </script>
  </head>
  <body></body>
</html>
